; TI3042 · ES2 — Nodo Sensor Minero "Estación Minera" (firmware monolítico)
; https://docs.platformio.org/page/project_config.html
;
; Sin librerías externas: solo el framework Arduino del core ESP32.
; Comandos:
;   pio run                     ; compilar
;   pio run -t upload           ; flashear (puerto autodetectado)
;   pio device monitor -b 115200 ; consola serial del nodo (teclas a/n/r/s/h)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
